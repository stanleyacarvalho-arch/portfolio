<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Link Enviado - JANOTEI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 70% 20%, #00e67633 0%, #111 40%), 
                  radial-gradient(circle at 20% 80%, #00b86b55 0%, #111 50%),
                  linear-gradient(135deg, #111 60%, #222 100%);
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 420px;
      height: 420px;
      left: -120px;
      top: -120px;
      background: radial-gradient(circle, #00e676 0%, transparent 80%);
    }
    body::after {
      width: 320px;
      height: 320px;
      right: -100px;
      bottom: -100px;
      background: radial-gradient(circle, #fff 0%, transparent 80%);
    }
    .confirmation-container {
      background: #181818ee;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 40px 32px 32px 32px;
      width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: 120px;
      margin-bottom: 32px;
    }
    .confirmation-title {
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
    }
    .confirmation-desc {
      color: #00b86b;
      font-size: 1rem;
      margin-bottom: 30px;
      text-align: center;
    }
    .back-link {
      margin-top: 40px;
      font-size: 0.92rem;
      color: #00b86b;
      text-decoration: none;
      transition: color 0.2s;
      align-self: center; /* Centralizado */
    }
    .back-link:hover {
      color: #00e676;
    }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <img src="JANOTEI LOGO VETOR (1).png" alt="JANOTEI Logo" class="logo">
    <div class="confirmation-title">Link Enviado!</div>
    <div class="confirmation-desc">Confira sua caixa de e-mail.</div>
    <a href="#" class="back-link">Voltar para a tela de login</a>
  </div>
</body>
</html>
