<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Novo Tempo</title>
  <link rel="stylesheet" href="styles/login.css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <img src="../public/Logo_Novo_Tempo.png" alt="Logo Novo Tempo" class="logo" />
    <div class="welcome">Acompanha NT</div>
    <form>
      <div class="input-group">
        <label for="email" class="sr-only">E-mail corporativo</label>
        <input id="email" type="email" placeholder="E-mail corporativo" required />
      </div>
      <div class="input-group">
        <label for="password" class="sr-only">Senha</label>
        <input id="password" type="password" placeholder="Senha" required />
      </div>
      <div class="forgot">
        <a href="#">Esqueceu a senha?</a>
      </div>
      <button class="login-btn" type="submit">Entrar</button>
    </form>
  </div>
  <div class="copyright">
    © 2025 Novo Tempo. Todos os direitos reservados.
  </div>
  <script src="main.js"></script>
</body>
</html>
